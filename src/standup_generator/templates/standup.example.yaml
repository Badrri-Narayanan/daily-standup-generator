# Daily standup generator config. Copy to ./standup.yaml or ~/.config/standup/standup.yaml.
# Secrets (tokens) go in .env, never here.

# timezone: Europe/London          # optional; defaults to system local time
working_days: [mon, tue, wed, thu, fri]
holidays: []                       # e.g. [2026-12-25, 2026-12-26]
ticket_key_pattern: "[A-Z][A-Z0-9]+-\\d+"

sources:
  jira:
    enabled: true
    base_url: https://yourco.atlassian.net
    email_env: JIRA_EMAIL
    token_env: JIRA_API_TOKEN
    project_keys: []               # e.g. [OFF, GPO]; empty = all projects
    in_progress_statuses: ["In Progress", "In Review", "Code Review"]
    handoff_statuses: ["QA", "Ready for QA", "In QA", "Done"]
    exclude_if_reassigned_to_me: true   # set false if your team doesn't reassign to QA
  github:
    enabled: true
    token_env: GITHUB_TOKEN
    api_url: https://api.github.com
    orgs: []
  git_local:
    enabled: true
    repos: []                      # explicit repo paths
    scan_dirs: ["~/code"]          # repos found up to 2 levels deep
    author_emails: []              # default: git config --global user.email
  custom: []                       # e.g. [{path: "my_pkg.sources:GitLabSource", options: {}}]

blockers:
  keywords: [blocked, blocker, "waiting on", "waiting for", "depends on", stuck]
  stale_pr_hours: 24

history:
  enabled: true
  db_path: ~/.local/share/standup-generator/history.db

prompt:
  template_path: null              # path to your own Jinja2 template
  max_comment_chars: 500
