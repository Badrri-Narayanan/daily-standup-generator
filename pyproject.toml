[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standup-generator"
version = "0.1.0"
description = "Collect Jira, GitHub and git activity and build a daily standup prompt"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
standup = "standup_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/standup_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
